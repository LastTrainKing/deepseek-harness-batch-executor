# DSH bundle profile patch.
#
# This is what makes the plugin installable AND active via:
#   dsh plugin add github:LastTrainKing/deepseek-harness-batch-executor
#
# `id`   = the Cordis plugin id (see `export const name` in lib/index.js)
# `name` = the package name resolved from node_modules after install
- insert:
    - id: deepseek-harness-batch-executor
      name: deepseek-harness-batch-executor
